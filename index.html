<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Viewer Simple</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      background: #f4f4f9;
      margin: 0;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
    }
    .search-box {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      margin-bottom: 15px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .table-wrapper {
      overflow-x: auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 10px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      background-color: #0b132b;
      color: #ffffff;
      position: sticky;
      top: 0;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    #status {
      padding: 10px;
      background: #ffeeba;
      color: #856404;
      border-radius: 4px;
      margin-bottom: 15px;
      font-weight: bold;
    }
    img.thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .tab-badge {
      background: #dc2626;
      color: #fff;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Data ELITE FAN A446 JEMBER (Simple View)</h2>
  
  <div id="status">⏳ Loading data dari server... Mohon tunggu...</div>
  
  <input type="text" id="search" class="search-box" placeholder="Cari Article, Nama, Barcode, Kategori..." onkeyup="filterData()">
  
  <div class="table-wrapper">
    <table id="dataTable">
      <thead>
        <tr id="tableHead"></tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>
  </div>

  <script>
    let globalData = [];
    let headers = [];

    // Ketika halaman selesai dimuat, ambil data dari Code.gs
    window.onload = function() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.status === 'success') {
              globalData = response.data;
              document.getElementById('status').style.display = 'none';
              renderTable(globalData);
            } else {
              document.getElementById('status').innerText = "❌ Error: " + response.message;
              document.getElementById('status').style.background = "#f8d7da";
              document.getElementById('status').style.color = "#721c24";
            }
          })
          .withFailureHandler(function(err) {
            document.getElementById('status').innerText = "❌ Gagal terhubung ke jaringan Google.";
          })
          .getSheetData();
      } else {
        document.getElementById('status').innerText = "⚠️ Harap buka halaman ini melalui link Web App Google Apps Script.";
      }
    };

    function renderTable(dataArray) {
      if (dataArray.length === 0) {
        document.getElementById('tableBody').innerHTML = '<tr><td style="text-align:center;">Tidak ada data ditemukan</td></tr>';
        return;
      }

      // 1. Kumpulkan semua header unik dari semua sheet
      let headerSet = new Set();
      headerSet.add('Tab Asal'); // Header custom dari script kita
      headerSet.add('Gambar');   // Header custom untuk menyatukan gambar
      
      dataArray.forEach(row => {
        Object.keys(row).forEach(k => {
          // Abaikan variasi nama header gambar agar tidak dobel
          if (k !== 'Tab Asal' && k !== 'Gambar' && k !== 'Gambar 1' && k !== 'Gambar 2' && k !== 'Gambar1' && k !== 'Gambar2') {
            headerSet.add(k);
          }
        });
      });
      
      headers = Array.from(headerSet);

      // 2. Render Bagian Kepala Tabel (THEAD)
      let headHtml = '';
      headers.forEach(h => {
        headHtml += `<th>${h}</th>`;
      });
      document.getElementById('tableHead').innerHTML = headHtml;

      // 3. Render Bagian Isi Tabel (TBODY)
      let bodyHtml = '';
      dataArray.forEach(row => {
        bodyHtml += '<tr>';
        headers.forEach(h => {
          let val = row[h] || '';
          
          // Format Khusus untuk Tab Asal
          if (h === 'Tab Asal') {
             val = `<span class="tab-badge">${val}</span>`;
          }
          
          // Format Khusus untuk Gambar
          if (h === 'Gambar') {
             let imgUrl = row['Gambar'] || row['Gambar 1'] || row['Gambar1'] || row['Gambar 2'] || row['Gambar2'] || '';
             if (imgUrl.startsWith('http')) {
               val = `<a href="${imgUrl}" target="_blank"><img class="thumb" src="${imgUrl}" onerror="this.style.display='none'"></a>`;
             } else {
               val = '-';
             }
          }
          
          bodyHtml += `<td>${val}</td>`;
        });
        bodyHtml += '</tr>';
      });
      document.getElementById('tableBody').innerHTML = bodyHtml;
    }

    // Fungsi Pencarian
    function filterData() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      
      if (!q) {
        renderTable(globalData);
        return;
      }

      const filtered = globalData.filter(row => {
        // Cek apakah ada nilai di baris ini yang mengandung kata kunci pencarian
        return Object.values(row).some(val => 
          String(val).toLowerCase().includes(q)
        );
      });
      
      renderTable(filtered);
    }
  </script>
</body>
</html>
