<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog Produk App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Barcode & QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animasi Modal */
        .modal-enter { transform: translateY(100%); opacity: 0; }
        .modal-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s ease-out; }
        .modal-leave { transform: translateY(0); opacity: 1; }
        .modal-leave-active { transform: translateY(100%); opacity: 0; transition: all 0.2s ease-in; }

        /* Styling Tabel Custom Scrollbar (Fitur 4) */
        .table-scroll-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 15px; /* Memberi ruang untuk scrollbar */
        }
        .table-scroll-container::-webkit-scrollbar {
            height: 12px;
        }
        .table-scroll-container::-webkit-scrollbar-track {
            background: #e5e7eb;
            border-radius: 8px;
        }
        .table-scroll-container::-webkit-scrollbar-thumb {
            background-color: #f97316; /* Warna Oranye */
            border-radius: 8px;
            border: 2px solid #e5e7eb;
        }
        .table-scroll-container::-webkit-scrollbar-thumb:hover {
            background-color: #ea580c;
        }

        .data-table th { 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            white-space: nowrap; 
        }
        .data-table td { 
            white-space: nowrap; 
            max-width: 250px; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-white shadow-sm z-20 flex-shrink-0">
        <!-- Logo -->
        <div class="px-4 py-3 flex items-center justify-between border-b border-gray-100">
            <div class="flex items-center space-x-2 text-orange-500">
                <i class="fas fa-store text-2xl"></i>
                <h1 class="text-lg font-bold tracking-tight text-gray-800">ELITE FAN <span class="text-orange-500">A446</span> JEMBER</h1>
            </div>
        </div>

        <!-- Pencarian & Filter -->
        <div class="px-4 py-3 bg-gray-50 flex flex-col space-y-3">
            <div class="flex space-x-2 relative w-full">
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                        <i class="fas fa-search"></i>
                    </span>
                    <input type="text" id="search-input" onkeyup="handleSearch()" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent text-sm" placeholder="Cari Article, Nama, Remark, Barcode...">
                </div>
                <button onclick="openScanner()" class="bg-orange-100 text-orange-600 px-3 py-2 rounded-lg border border-orange-200 hover:bg-orange-200 transition">
                    <i class="fas fa-qrcode"></i>
                </button>
            </div>
            
            <div class="w-full flex space-x-2">
                <select id="mobile-filter" onchange="handleSearch()" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-orange-500">
                    <option value="">Semua Kategori (Filter)</option>
                    <!-- Opsi Filter -->
                </select>
                <!-- Tombol Pengaturan Kolom (Fitur 3) -->
                <button onclick="toggleColumnModal()" class="bg-gray-100 text-gray-600 px-3 py-2 rounded-lg border border-gray-300 hover:bg-gray-200 transition flex items-center justify-center">
                    <i class="fas fa-eye-slash mr-1"></i> <span class="text-xs font-semibold">Kolom</span>
                </button>
            </div>
        </div>

        <!-- Tab Sheet -->
        <div class="border-t border-gray-200 bg-white shadow-sm">
            <div id="tabs-container" class="flex overflow-x-auto no-scrollbar py-2 px-4 space-x-2">
                <!-- Tab Sheet -->
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-auto bg-white relative" id="main-content">
        <!-- Fitur 4: Wrapper tabel dengan custom horizontal scrollbar -->
        <div class="table-scroll-container min-h-full pb-20 px-2 pt-2">
            <div id="list-container" class="min-w-max w-full">
                <div class="text-center py-20 text-gray-500 w-full">
                    <i class="fas fa-circle-notch fa-spin text-3xl text-orange-500 mb-3"></i>
                    <p>Memuat data...</p>
                </div>
            </div>
        </div>
        
        <!-- Pagination Controls -->
        <div id="pagination-container" class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] hidden z-20">
        </div>
    </main>

    <!-- Modal Pengaturan Kolom (Sembunyikan Header) -->
    <div id="column-modal" class="fixed inset-0 bg-black bg-opacity-75 z-50 hidden flex-col justify-center items-center">
        <div class="bg-white p-4 rounded-xl w-11/12 max-w-md relative max-h-[80vh] flex flex-col">
            <button onclick="toggleColumnModal()" class="absolute -top-3 -right-3 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg hover:bg-red-600">
                <i class="fas fa-times"></i>
            </button>
            <h3 class="text-lg font-bold text-center mb-4 text-gray-800">Tampilkan/Sembunyikan Kolom</h3>
            <div class="overflow-y-auto px-2 pb-4 flex-1 space-y-2" id="column-list-container">
                <!-- Checklist kolom akan di-render di sini -->
            </div>
            <div class="pt-4 border-t border-gray-200">
                <button onclick="applyColumnConfig()" class="w-full bg-orange-500 text-white font-bold py-2 rounded-lg hover:bg-orange-600">Simpan Tampilan</button>
            </div>
        </div>
    </div>

    <!-- Modal Scanner Kamera -->
    <div id="scanner-modal" class="fixed inset-0 bg-black bg-opacity-75 z-[60] hidden flex-col justify-center items-center">
        <div class="bg-white p-4 rounded-xl w-11/12 max-w-md relative">
            <button onclick="closeScanner()" class="absolute -top-3 -right-3 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-lg hover:bg-red-600 z-10">
                <i class="fas fa-times"></i>
            </button>
            <h3 class="text-lg font-bold text-center mb-4 text-gray-800">Scan Barcode / QR</h3>
            <div id="reader" class="w-full rounded-lg overflow-hidden border-2 border-orange-500 bg-black min-h-[250px]"></div>
            <p class="text-xs text-center text-gray-500 mt-4">Arahkan kamera dengan jelas ke Barcode Produk.</p>
        </div>
    </div>

    <!-- Modal Kartu Produk (Bottom Sheet) -->
    <div id="product-modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden transition-opacity" onclick="closeModal()"></div>
    <div id="product-modal" class="fixed bottom-0 left-0 w-full bg-white rounded-t-2xl shadow-2xl z-50 modal-enter flex flex-col max-h-[90vh]">
        <div class="flex justify-center pt-3 pb-2 cursor-pointer" onclick="closeModal()">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
        </div>
        
        <div class="overflow-y-auto px-5 pb-8 pt-2 no-scrollbar" id="modal-content">
            <!-- Konten kartu akan dimuat di sini -->
        </div>
    </div>

    <script>
        // State Aplikasi
        let globalData = {};
        let currentSheet = '';
        let currentHeaders = [];
        let orderedHeaders = []; // Header setelah di-sort (Gambar di kiri)
        let hiddenColumns = []; // Menyimpan nama header yang disembunyikan
        let currentFilteredData = [];
        let html5QrcodeScanner = null;

        // State Pagination
        let currentPage = 1;
        const rowsPerPage = 50;

        // Mock data agar preview bekerja di editor (akan diabaikan di Apps Script)
        const isAppsScript = typeof google !== 'undefined' && google.script;
        const mockSheetNames = ["FAN", "Electrical"];
        const mockHeaders = ["ARTICLE", "PRODUCT NAME", "HARGA NORMAL", "Gambar", "Gambar 2", "Link to RR", "BARCODE", "REMARK TO STORE", "Stock A446"];
        const mockData = Array.from({length: 120}, (_, i) => ({
            "ARTICLE": "1053" + (8000 + i),
            "PRODUCT NAME": "MOCK FAN PRODUCT " + (i + 1),
            "HARGA NORMAL": "129900",
            "Gambar": "https://placehold.co/100x100/eeeeee/999999?text=Gbr1",
            "Gambar 2": i % 2 === 0 ? "https://placehold.co/100x100/eeeeee/999999?text=Gbr2" : "",
            "Link to RR": "https://ruparupa.com/search?q=fan",
            "BARCODE": "8990123" + (45000 + i),
            "REMARK TO STORE": i % 3 === 0 ? "Clearance" : "Lanjut",
            "Stock A446": Math.floor(Math.random() * 50)
        }));

        // Inisialisasi awal
        window.onload = function() {
            if (isAppsScript) {
                google.script.run.withSuccessHandler(renderTabs).getSheetNames();
            } else {
                renderTabs(mockSheetNames);
            }
        };

        function renderTabs(sheetNames) {
            const container = document.getElementById('tabs-container');
            container.innerHTML = '';
            
            sheetNames.forEach((name, index) => {
                const btn = document.createElement('button');
                btn.innerText = name;
                btn.className = `whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-colors border ${index === 0 ? 'bg-orange-100 text-orange-700 border-orange-200' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`;
                btn.onclick = () => loadSheet(name, btn);
                container.appendChild(btn);
            });

            if (sheetNames.length > 0) {
                loadSheet(sheetNames[0], container.firstChild);
            }
        }

        function loadSheet(sheetName, buttonElement) {
            currentSheet = sheetName;
            currentPage = 1; 
            document.getElementById('search-input').value = '';
            hiddenColumns = []; // Reset kolom yang disembunyikan tiap pindah sheet
            
            const tabs = document.getElementById('tabs-container').children;
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].className = 'whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-colors border bg-white text-gray-600 border-gray-300 hover:bg-gray-50';
            }
            if (buttonElement) {
                buttonElement.className = 'whitespace-nowrap px-4 py-1.5 rounded-full text-sm font-medium transition-colors border bg-orange-100 text-orange-700 border-orange-200';
            }

            document.getElementById('list-container').innerHTML = `
                <div class="text-center py-20 text-gray-500 w-full">
                    <i class="fas fa-circle-notch fa-spin text-3xl text-orange-500 mb-3"></i>
                    <p>Memuat data ${sheetName}...</p>
                </div>
            `;
            document.getElementById('pagination-container').classList.add('hidden');

            if (isAppsScript) {
                google.script.run.withSuccessHandler(res => {
                    processSheetData(res.headers, res.data);
                }).getSheetData(sheetName);
            } else {
                setTimeout(() => processSheetData(mockHeaders, mockData), 300);
            }
        }

        function processSheetData(headers, data) {
            currentHeaders = headers;
            globalData[currentSheet] = data;
            
            // FITUR 2: Urutkan header agar "Gambar" dan "Gambar 2" selalu di awal
            let imgHeaders = [];
            let otherHeaders = [];
            
            headers.forEach(h => {
                if (h.toLowerCase().includes('gambar')) {
                    imgHeaders.push(h);
                } else {
                    otherHeaders.push(h);
                }
            });
            // Urutkan gambar agar 'Gambar' muncul sebelum 'Gambar 2'
            imgHeaders.sort();
            orderedHeaders = [...imgHeaders, ...otherHeaders];

            updateFilterDropdown(orderedHeaders);
            renderTable(data);
        }

        function updateFilterDropdown(headers) {
            const select = document.getElementById('mobile-filter');
            select.innerHTML = '<option value="">Semua Kategori (Filter)</option>';
            headers.forEach(h => {
                select.innerHTML += `<option value="${h}">Berdasarkan ${h}</option>`;
            });
        }

        function toggleColumnModal() {
            const modal = document.getElementById('column-modal');
            if (modal.classList.contains('hidden')) {
                // Tampilkan isi modal
                const container = document.getElementById('column-list-container');
                container.innerHTML = '';
                orderedHeaders.forEach((h, i) => {
                    const isChecked = !hiddenColumns.includes(h);
                    container.innerHTML += `
                        <label class="flex items-center space-x-3 p-2 bg-gray-50 rounded-lg border border-gray-200">
                            <input type="checkbox" id="chk_col_${i}" value="${h}" ${isChecked ? 'checked' : ''} class="w-5 h-5 text-orange-500 rounded focus:ring-orange-500">
                            <span class="text-sm font-medium text-gray-700">${h}</span>
                        </label>
                    `;
                });
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        function applyColumnConfig() {
            hiddenColumns = [];
            orderedHeaders.forEach((h, i) => {
                const cb = document.getElementById(`chk_col_${i}`);
                if (cb && !cb.checked) {
                    hiddenColumns.push(h);
                }
            });
            toggleColumnModal();
            renderTable(currentFilteredData); // Render ulang dengan konfigurasi baru
        }

        function renderTable(data) {
            const container = document.getElementById('list-container');
            currentFilteredData = data; 
            
            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-500 py-20 w-full left-0 right-0">
                        <i class="fas fa-box-open text-4xl mb-4 text-gray-300"></i>
                        <p class="font-medium">Tidak ada data ditemukan.</p>
                    </div>`;
                renderPagination(0, false);
                return;
            }

            const searchValue = document.getElementById('search-input').value.trim();
            const filterValue = document.getElementById('mobile-filter').value;
            const isSearching = searchValue !== '' || filterValue !== '';
            
            let displayData = data;
            
            if (!isSearching) {
                const startIndex = (currentPage - 1) * rowsPerPage;
                const endIndex = startIndex + rowsPerPage;
                displayData = data.slice(startIndex, endIndex);
            }

            let html = `<table class="data-table w-full text-left border-collapse border border-gray-300 text-sm bg-white shadow-sm rounded-lg">`;
            
            // Header Render (Lewati jika disembunyikan)
            html += `<thead><tr>`;
            orderedHeaders.forEach(h => {
                if (hiddenColumns.includes(h)) return; // FITUR 3: Sembunyikan kolom
                html += `<th class="p-3 border border-gray-200 bg-gray-100 text-gray-700 font-bold uppercase tracking-wider text-xs">${h}</th>`;
            });
            html += `</tr></thead><tbody class="bg-white">`;

            // Data Render
            displayData.forEach((row, i) => {
                const actualIndex = isSearching ? i : ((currentPage - 1) * rowsPerPage) + i;
                
                html += `<tr class="border-b border-gray-100 hover:bg-orange-50 cursor-pointer transition-colors" onclick="openModal(${actualIndex})">`;
                
                orderedHeaders.forEach(h => {
                    if (hiddenColumns.includes(h)) return; // FITUR 3: Sembunyikan kolom

                    const val = row[h] !== undefined && row[h] !== '' ? row[h] : '-';
                    const isImage = h.toLowerCase().includes('gambar');
                    const isBarcode = h.toLowerCase() === 'barcode';
                    const isLink = h.toLowerCase().includes('link');
                    
                    html += `<td class="p-3 border border-gray-200">`;
                    if (isImage && val.toString().startsWith('http')) {
                        // Tampilkan Gambar di List
                        html += `<div class="w-12 h-12 rounded border border-gray-200 bg-gray-50 flex items-center justify-center overflow-hidden">
                                    <img src="${val}" alt="Img" class="w-full h-full object-contain" onerror="this.outerHTML='<i class=\\'fas fa-exclamation-triangle text-gray-400\\'></i>'">
                                 </div>`;
                    } else if (isBarcode && val !== '-') {
                        // Barcode sebagai teks link (Cepat dimuat)
                        html += `<span class="text-blue-600 font-medium underline flex items-center"><i class="fas fa-barcode mr-1"></i> ${val}</span>`;
                    } else if (isLink && val.toString().startsWith('http')) {
                        // Kolom berupa link (seperti Link to RR)
                         html += `<a href="${val}" target="_blank" onclick="event.stopPropagation()" class="text-blue-500 underline whitespace-nowrap"><i class="fas fa-external-link-alt"></i> Buka Link</a>`;
                    } else {
                        html += `<span>${val}</span>`;
                    }
                    html += `</td>`;
                });
                html += `</tr>`;
            });
            html += `</tbody></table>`;
            
            container.innerHTML = html;
            renderPagination(data.length, isSearching);
        }

        function renderPagination(totalItems, isSearching) {
            const container = document.getElementById('pagination-container');
            if (isSearching || totalItems <= rowsPerPage) {
                container.classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');
            const totalPages = Math.ceil(totalItems / rowsPerPage);
            
            container.innerHTML = `
                <div class="flex justify-between items-center py-3 px-6 max-w-md mx-auto">
                    <button onclick="changePage(-1)" class="px-4 py-2 rounded-lg text-sm font-bold shadow-sm ${currentPage === 1 ? 'bg-gray-100 text-gray-400' : 'bg-orange-100 text-orange-600 border border-orange-200'}" ${currentPage === 1 ? 'disabled' : ''}>
                        <i class="fas fa-chevron-left mr-1"></i> Prev
                    </button>
                    <span class="text-sm text-gray-600 font-medium">Halaman ${currentPage} / ${totalPages}</span>
                    <button onclick="changePage(1)" class="px-4 py-2 rounded-lg text-sm font-bold shadow-sm ${currentPage === totalPages ? 'bg-gray-100 text-gray-400' : 'bg-orange-100 text-orange-600 border border-orange-200'}" ${currentPage === totalPages ? 'disabled' : ''}>
                        Next <i class="fas fa-chevron-right ml-1"></i>
                    </button>
                </div>
            `;
        }

        function changePage(step) {
            const totalPages = Math.ceil(currentFilteredData.length / rowsPerPage);
            const newPage = currentPage + step;
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderTable(currentFilteredData);
                document.getElementById('main-content').scrollTop = 0;
            }
        }

        function getColKey(row, keywords) {
            const keys = Object.keys(row);
            for (let i = 0; i < keys.length; i++) {
                const k = keys[i].toLowerCase();
                for (let j = 0; j < keywords.length; j++) {
                    if (k.includes(keywords[j].toLowerCase())) return Object.keys(row)[i];
                }
            }
            return null;
        }

        function handleSearch() {
            setTimeout(() => {
                const searchValue = document.getElementById('search-input').value.toLowerCase();
                const filterHeader = document.getElementById('mobile-filter').value;
                const data = globalData[currentSheet] || [];
                let filtered = data;

                if (searchValue) {
                    filtered = filtered.filter(row => {
                        const articleKey = getColKey(row, ['article', 'artcile', 'articile']);
                        const nameKey = getColKey(row, ['product name', 'nama']);
                        const remarkKey = getColKey(row, ['remark', 'remark to store']);
                        const barcodeKey = getColKey(row, ['barcode']);

                        const valArticle = articleKey ? String(row[articleKey] || '').toLowerCase() : '';
                        const valName = nameKey ? String(row[nameKey] || '').toLowerCase() : '';
                        const valRemark = remarkKey ? String(row[remarkKey] || '').toLowerCase() : '';
                        const valBarcode = barcodeKey ? String(row[barcodeKey] || '').toLowerCase() : '';

                        return valArticle.includes(searchValue) || 
                               valName.includes(searchValue) || 
                               valRemark.includes(searchValue) ||
                               valBarcode.includes(searchValue);
                    });
                }

                if (filterHeader) {
                    filtered = filtered.filter(row => {
                        const val = row[filterHeader];
                        return val !== undefined && val !== null && val.toString().trim() !== '';
                    });
                }

                currentPage = 1; 
                renderTable(filtered);
            }, 10); 
        }

        function openModal(rowIndex) {
            const data = currentFilteredData[rowIndex];
            if (!data) return;

            const modal = document.getElementById('product-modal');
            const backdrop = document.getElementById('product-modal-backdrop');
            const content = document.getElementById('modal-content');
            content.innerHTML = '';

            // Cari Gambar 1 & Gambar 2 (FITUR 5)
            let imageHtml = '';
            orderedHeaders.forEach(h => {
                if (h.toLowerCase().includes('gambar') && data[h] && data[h].toString().startsWith('http')) {
                    imageHtml += `
                        <div class="flex-1 min-w-[120px] h-36 bg-white border border-gray-200 flex items-center justify-center rounded-xl p-2 shadow-sm">
                            <img src="${data[h]}" class="max-h-full max-w-full object-contain rounded-lg" onerror="this.outerHTML='<i class=\\'fas fa-image text-4xl text-gray-300\\'></i>'">
                        </div>
                    `;
                }
            });

            if (imageHtml !== '') {
                content.innerHTML += `<div class="flex space-x-2 w-full mb-5 overflow-x-auto p-1">${imageHtml}</div>`;
            }

            // Render Detail Teks
            let detailsHtml = '<div class="space-y-4">';
            let barcodeValue = '';
            
            orderedHeaders.forEach(h => {
                if (!h.toLowerCase().includes('gambar')) {
                    let val = data[h] !== undefined && data[h] !== '' ? data[h] : '-';
                    
                    if (h.toLowerCase() === 'barcode') {
                        barcodeValue = val;
                    }
                    
                    // FITUR 5: Link to RR menjadi bisa diklik
                    if (h.toLowerCase().includes('link') && val.toString().startsWith('http')) {
                        val = `<a href="${val}" target="_blank" class="text-blue-500 font-bold underline"><i class="fas fa-external-link-alt"></i> Buka Halaman Produk</a>`;
                    }

                    detailsHtml += `
                        <div class="flex flex-col border-b border-gray-100 pb-2">
                            <span class="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-1">${h}</span>
                            <span class="text-sm font-semibold text-gray-800 break-words">${val}</span>
                        </div>
                    `;
                }
            });
            detailsHtml += '</div>';

            // FITUR 5: Generate Barcode Menjadi Kotak Persegi
            if (barcodeValue && barcodeValue !== '-') {
                detailsHtml += `
                    <div class="mt-6 mb-4 flex flex-col items-center p-4 bg-white rounded-xl shadow-[0_0_10px_rgba(0,0,0,0.1)] border border-gray-100">
                        <span class="text-xs text-gray-500 font-bold uppercase mb-2">Scan Barcode (Arahkan Kamera)</span>
                        <!-- Aspek Rasio Persegi dan padding -->
                        <div class="bg-white p-2 rounded w-full flex justify-center aspect-square items-center">
                            <svg id="barcode-canvas" class="w-full h-full max-w-[200px] max-h-[200px]"></svg>
                        </div>
                    </div>
                `;
            }

            content.innerHTML += detailsHtml;

            // Tampilkan Modal
            backdrop.classList.remove('hidden');
            modal.classList.replace('modal-leave-active', 'modal-enter');
            modal.classList.replace('modal-leave', 'modal-enter');
            
            setTimeout(() => {
                modal.classList.replace('modal-enter', 'modal-enter-active');
                
                // Eksekusi JsBarcode untuk bikin kotak (Lebar ditekan, tinggi dinaikkan)
                if (barcodeValue && barcodeValue !== '-') {
                    try {
                        JsBarcode("#barcode-canvas", barcodeValue.toString(), {
                            format: "CODE128",
                            width: 2.5,   // Ketebalan garis 
                            height: 150,  // Dibuat sangat tinggi supaya menyerupai persegi panjang vertikal/persegi
                            displayValue: true,
                            fontSize: 20,
                            fontOptions: "bold",
                            margin: 0
                        });
                    } catch(e) {
                        console.error("Gagal menggambar barcode", e);
                    }
                }
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('product-modal');
            const backdrop = document.getElementById('product-modal-backdrop');
            
            modal.classList.replace('modal-enter-active', 'modal-leave');
            setTimeout(() => {
                modal.classList.replace('modal-leave', 'modal-leave-active');
                backdrop.classList.add('hidden');
            }, 200);
        }

        function openScanner() {
            // FITUR 1 Fix: Pastikan modal tampil DULU sebelum kamera dipanggil
            const scannerModal = document.getElementById('scanner-modal');
            scannerModal.classList.remove('hidden');
            scannerModal.classList.add('flex');
            
            // Beri jeda 300ms agar DOM Modal benar-benar siap dan terlihat oleh library
            setTimeout(() => {
                if (!html5QrcodeScanner) {
                    html5QrcodeScanner = new Html5Qrcode("reader");
                }
                
                const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess)
                .catch(err => {
                    alert("Akses kamera ditolak atau kamera tidak ditemukan. Pastikan browser memiliki izin kamera. Error: " + err);
                    closeScanner();
                });
            }, 300);
        }

        function closeScanner() {
            const scannerModal = document.getElementById('scanner-modal');
            scannerModal.classList.add('hidden');
            scannerModal.classList.remove('flex');
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner.clear();
                }).catch(err => console.error(err));
            }
        }

        function onScanSuccess(decodedText) {
            closeScanner();
            const searchInput = document.getElementById('search-input');
            searchInput.value = decodedText;
            handleSearch();
        }
    </script>
</body>
</html>
