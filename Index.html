<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ELITE FAN A446 JEMBER</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    /* =========================================================
       THEME: DARK NAVY (#0b132b) & VIVID RED (#dc2626)
       3D EMBOSSED / TACTILE UI EFFECTS
       ========================================================= */
    :root {
      --bg-dark: #070c18;
      --bg-card: #0e172c;
      --bg-card-light: #16223f;
      --bg-input: #0a1122;
      
      --accent-red: #dc2626;
      --accent-red-hover: #ef4444;
      --accent-red-dark: #991b1b;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --border-dark: #1e293b;
      --border-light: rgba(255, 255, 255, 0.08);

      /* Embossed / 3D Shadow Tokens */
      --shadow-emboss: 5px 5px 12px #03060d, -3px -3px 8px #131e38;
      --shadow-emboss-sm: 3px 3px 6px #03060d, -2px -2px 5px #131e38;
      --shadow-inset: inset 2px 2px 5px #03060d, inset -2px -2px 5px #131e38;
      --shadow-red-glow: 0 4px 15px rgba(220, 38, 38, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 30px;
    }

    /* ================= HEADER ================= */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(145deg, #0e172c, #0a1020);
      border-bottom: 2px solid var(--accent-red);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      padding: 12px 14px;
    }

    .header-title-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, var(--accent-red), var(--accent-red-dark));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-red-glow);
      font-size: 20px;
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .brand-text span {
      font-size: 0.7rem;
      color: var(--accent-red);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .sync-status {
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sync-status.loading {
      background: rgba(234, 179, 8, 0.15);
      color: #fde047;
      border-color: rgba(234, 179, 8, 0.3);
    }

    /* Sheet Tabs */
    .sheet-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .sheet-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 1;
      min-width: 80px;
      padding: 8px 12px;
      background: var(--bg-card);
      border: none;
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 700;
      box-shadow: var(--shadow-emboss-sm);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-red), #b91c1c);
      color: #ffffff;
      box-shadow: var(--shadow-red-glow);
    }

    /* ================= CONTROL PANEL (SEARCH & FILTERS) ================= */
    .control-panel {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-box-row {
      display: flex;
      gap: 8px;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input-wrapper input {
      width: 100%;
      padding: 11px 12px 11px 36px;
      background: var(--bg-input);
      border: 1px solid var(--border-dark);
      border-radius: 10px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      box-shadow: var(--shadow-inset);
      transition: border-color 0.2s;
    }

    .search-input-wrapper input:focus {
      border-color: var(--accent-red);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .btn-scan {
      padding: 0 14px;
      background: linear-gradient(145deg, var(--accent-red), var(--accent-red-dark));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-red-glow);
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-scan:active {
      transform: scale(0.96);
    }

    /* Filter Row */
    .filter-row {
      display: flex;
      gap: 8px;
    }

    .filter-select {
      flex: 1;
      padding: 9px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.78rem;
      outline: none;
      box-shadow: var(--shadow-emboss-sm);
    }

    /* ================= MAIN DATA TABLE / LIST ================= */
    .content-area {
      padding: 0 14px;
      flex: 1;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .stats-count strong {
      color: var(--accent-red);
    }

    .data-table-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Embossed Row Card (Table-Like Mobile Row) */
    .data-row-card {
      background: linear-gradient(145deg, var(--bg-card), var(--bg-card-light));
      border-radius: 12px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-emboss);
      border: 1px solid var(--border-light);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .data-row-card:active {
      transform: scale(0.98);
      box-shadow: var(--shadow-inset);
    }

    /* Far Left Images (Gambar 1 & Gambar 2) */
    .row-images-group {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .thumb-img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: var(--shadow-emboss-sm);
    }

    .thumb-fallback {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--bg-input);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-size: 14px;
      border: 1px solid var(--border-dark);
    }

    /* Row Content Details */
    .row-info {
      flex: 1;
      min-width: 0; /* Prevents overflow */
    }

    .row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
    }

    .row-article {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--accent-red);
      letter-spacing: 0.5px;
    }

    .row-title {
      font-size: 0.83rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .row-subinfo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .category-badge {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.68rem;
    }

    .stock-badge {
      font-weight: 700;
    }

    .stock-badge.has-stock {
      color: #4ade80;
    }

    .stock-badge.no-stock {
      color: #f87171;
    }

    .status-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .status-active {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-discontinue {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .status-inactive {
      background: rgba(148, 163, 184, 0.2);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    /* Price / Promo Column on right */
    .row-price-col {
      text-align: right;
      flex-shrink: 0;
    }

    .price-value {
      font-size: 0.82rem;
      font-weight: 800;
      color: #facc15;
    }

    .promo-disc {
      font-size: 0.68rem;
      color: var(--accent-red);
      font-weight: 700;
    }

    /* Load More Button */
    .btn-load-more {
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      background: linear-gradient(145deg, var(--bg-card-light), var(--bg-card));
      border: 1px solid var(--border-light);
      border-radius: 10px;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: var(--shadow-emboss);
      cursor: pointer;
      text-align: center;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state icon {
      font-size: 40px;
      display: block;
      margin-bottom: 10px;
    }

    /* ================= DETAIL MODAL CARD ================= */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-height: 90vh;
      background: linear-gradient(160deg, #0e172c, #070c18);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border-top: 2px solid var(--accent-red);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-dark);
      background: rgba(255, 255, 255, 0.02);
    }

    .modal-title-wrap h2 {
      font-size: 1rem;
      font-weight: 800;
      color: #fff;
    }

    .modal-title-wrap p {
      font-size: 0.75rem;
      color: var(--accent-red);
      font-weight: 700;
    }

    .btn-close-modal {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      color: var(--text-muted);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-emboss-sm);
      cursor: pointer;
    }

    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Modal Gallery Switcher */
    .gallery-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .gallery-main-img {
      width: 100%;
      height: 200px;
      border-radius: 14px;
      object-fit: contain;
      background: #000;
      box-shadow: var(--shadow-emboss);
      border: 1px solid var(--border-light);
    }

    .gallery-thumbs {
      display: flex;
      gap: 10px;
    }

    .gallery-thumb-btn {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      object-fit: cover;
      background: #000;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.6;
      box-shadow: var(--shadow-emboss-sm);
    }

    .gallery-thumb-btn.active {
      border-color: var(--accent-red);
      opacity: 1;
    }

    /* Details Specs Table */
    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .spec-item {
      background: var(--bg-card);
      padding: 10px 12px;
      border-radius: 10px;
      box-shadow: var(--shadow-emboss-sm);
      border: 1px solid var(--border-dark);
    }

    .spec-item.full-width {
      grid-column: span 2;
    }

    .spec-label {
      font-size: 0.68rem;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .spec-value {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-word;
    }

    /* Barcode Section inside Modal */
    .barcode-card-section {
      background: #ffffff;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      box-shadow: var(--shadow-emboss);
    }

    .barcode-card-section label {
      display: block;
      font-size: 0.72rem;
      color: #475569;
      font-weight: 800;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .barcode-img {
      max-width: 180px;
      height: auto;
      margin: 0 auto;
      display: block;
    }

    .barcode-code-text {
      font-family: monospace;
      font-size: 0.85rem;
      font-weight: 800;
      color: #0f172a;
      margin-top: 4px;
    }

    /* Ruparupa Link Button */
    .rr-link-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-red), #b91c1c);
      color: #ffffff;
      text-decoration: none;
      text-align: center;
      font-weight: 800;
      font-size: 0.9rem;
      border-radius: 12px;
      box-shadow: var(--shadow-red-glow);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .rr-link-btn:active {
      transform: scale(0.97);
    }

    /* ================= SCANNER MODAL ================= */
    #scanner-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #scanner-modal.active {
      display: flex;
    }

    #reader {
      width: 100%;
      max-width: 380px;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--accent-red);
      box-shadow: var(--shadow-red-glow);
    }

    .btn-close-scanner {
      margin-top: 20px;
      padding: 10px 24px;
      background: var(--accent-red);
      color: #fff;
      border: none;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header>
    <div class="header-title-container">
      <div class="brand-logo">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <h1>ELITE FAN A446</h1>
          <span>JEMBER STORE</span>
        </div>
      </div>
      <div class="sync-status loading" id="sync-status">
        <span>●</span> <span id="sync-text">Loading Data...</span>
      </div>
    </div>

    <!-- Sheet Tabs -->
    <div class="sheet-tabs" id="sheet-tabs">
      <button class="tab-btn active" onclick="switchTab('FAN', this)">FAN</button>
      <button class="tab-btn" onclick="switchTab('ELECTRICAL', this)">ELECTRICAL</button>
      <button class="tab-btn" onclick="switchTab('LIGHTING', this)">LIGHTING</button>
      <button class="tab-btn" onclick="switchTab('STOCK', this)">STOCK</button>
    </div>
  </header>

  <!-- ================= CONTROL PANEL (SEARCH & FILTERS) ================= -->
  <div class="control-panel">
    <!-- Search Bar + Scanner Button -->
    <div class="search-box-row">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Cari Article, Nama, Barcode..." oninput="onSearchInput()">
      </div>
      <button class="btn-scan" onclick="startScanner()">
        <span>📷</span> Scan
      </button>
    </div>

    <!-- Filter Dropdowns -->
    <div class="filter-row">
      <select class="filter-select" id="category-filter" onchange="applyFilters()">
        <option value="">Semua Kategori</option>
      </select>

      <select class="filter-select" id="status-filter" onchange="applyFilters()">
        <option value="">Semua Status</option>
        <option value="Active">Active</option>
        <option value="Discontinue">Discontinue</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
  </div>

  <!-- ================= MAIN DATA CONTENT ================= -->
  <div class="content-area">
    <div class="stats-bar">
      <div class="stats-count">Menampilkan <strong id="visible-count">0</strong> dari <strong id="total-count">0</strong> item</div>
      <div id="active-tab-label">Tab: FAN</div>
    </div>

    <!-- Data Rows List (Table-like view for mobile) -->
    <div class="data-table-container" id="data-list">
      <!-- Dynamic rows injected here -->
    </div>

    <button class="btn-load-more" id="btn-load-more" style="display:none;" onclick="loadNextPage()">
      Tampilkan Lebih Banyak (Load More)
    </button>
  </div>

  <!-- ================= PRODUCT DETAIL MODAL CARD ================= -->
  <div class="modal-overlay" id="detail-modal" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <h2 id="modal-product-name">Product Name</h2>
          <p id="modal-article-code">Article: 000000</p>
        </div>
        <button class="btn-close-modal" onclick="closeModal()">✕</button>
      </div>

      <div class="modal-body">
        <!-- Image Preview & Switcher -->
        <div class="gallery-container">
          <img id="modal-main-img" class="gallery-main-img" src="" alt="Gambar Produk" onerror="this.src='https://via.placeholder.com/300x200/0a1122/64748b?text=No+Image'">
          <div class="gallery-thumbs" id="modal-thumbs">
            <!-- Thumbnail buttons -->
          </div>
        </div>

        <!-- Specifications Grid -->
        <div class="specs-grid">
          <div class="spec-item">
            <div class="spec-label">Kategori / Purch Group</div>
            <div class="spec-value" id="modal-category">-</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Status</div>
            <div class="spec-value" id="modal-status">-</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Stok</div>
            <div class="spec-value" id="modal-stock">-</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Harga / Promo All Store</div>
            <div class="spec-value" id="modal-price" style="color:#facc15;">-</div>
          </div>
          <div class="spec-item full-width">
            <div class="spec-label">Diskon / Remark</div>
            <div class="spec-value" id="modal-remark">-</div>
          </div>
          <div class="spec-item full-width">
            <div class="spec-label">Periode Promo</div>
            <div class="spec-value" id="modal-periode">-</div>
          </div>
        </div>

        <!-- Scannable Barcode Image Section -->
        <div class="barcode-card-section">
          <label>BARCODE PRODUK (DAPAT DISCAN)</label>
          <img id="modal-barcode-img" class="barcode-img" src="" alt="Barcode Image">
          <div class="barcode-code-text" id="modal-barcode-text">000000</div>
        </div>

        <!-- Ruparupa Link Button -->
        <a href="#" target="_blank" class="rr-link-btn" id="modal-rr-link">
          🛒 Buka di Ruparupa (Link RR)
        </a>
      </div>
    </div>
  </div>

  <!-- ================= CAMERA BARCODE SCANNER MODAL ================= -->
  <div id="scanner-modal">
    <div id="reader"></div>
    <button class="btn-close-scanner" onclick="stopScanner()">Tutup Kamera</button>
  </div>

  <!-- ================= JAVASCRIPT APP LOGIC ================= -->
  <script>
    /* Published CSV Export Endpoints (For fallback / max speed) */
    const CSV_URLS = {
      'FAN': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR4Q0ApLYOLTznzPSV8vO5aRzEG1RgoUYqLnQdiMqFnslxrxBATFfNlfj1A9yWrGXdshslDrgAeQxGu/pub?output=csv&gid=0',
      'ELECTRICAL': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR4Q0ApLYOLTznzPSV8vO5aRzEG1RgoUYqLnQdiMqFnslxrxBATFfNlfj1A9yWrGXdshslDrgAeQxGu/pub?output=csv&gid=153959005',
      'LIGHTING': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR4Q0ApLYOLTznzPSV8vO5aRzEG1RgoUYqLnQdiMqFnslxrxBATFfNlfj1A9yWrGXdshslDrgAeQxGu/pub?output=csv&gid=945172999',
      'STOCK': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR4Q0ApLYOLTznzPSV8vO5aRzEG1RgoUYqLnQdiMqFnslxrxBATFfNlfj1A9yWrGXdshslDrgAeQxGu/pub?output=csv&gid=1978435578'
    };

    // State Variables
    let allData = { 'FAN': [], 'ELECTRICAL': [], 'LIGHTING': [], 'STOCK': [] };
    let currentTab = 'FAN';
    let filteredList = [];
    let currentPage = 1;
    const PAGE_SIZE = 30;
    let html5QrcodeScanner = null;
    let searchDebounceTimer = null;

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
    });

    /**
     * Load Data from Apps Script backend or fallback to Published CSVs
     */
    async function loadData() {
      updateSyncStatus(true, "Memuat Data...");

      // Check sessionStorage cache first for instant speed
      const cached = sessionStorage.getItem('elite_fan_data_v1');
      if (cached) {
        try {
          allData = JSON.parse(cached);
          updateSyncStatus(false, "Selesai (Cached)");
          renderCurrentTab();
          // Silently fetch fresh data in background
          fetchFreshData();
          return;
        } catch (e) {
          console.warn("Cache parse error", e);
        }
      }

      await fetchFreshData();
    }

    async function fetchFreshData() {
      // Menggunakan google.script.run agar tidak terkena blokir CORS di browser.
      // Karena data sudah dikurangi, loading ini akan berjalan lancar dan cepat.
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response && response.status === 'success' && response.data) {
              allData = response.data;
              sessionStorage.setItem('elite_fan_data_v1', JSON.stringify(allData));
              updateSyncStatus(false, "Selesai");
              renderCurrentTab();
            } else {
              updateSyncStatus(false, "Gagal Memuat");
            }
          })
          .withFailureHandler(function(err) {
            console.error("GAS error:", err);
            updateSyncStatus(false, "Gagal Jaringan");
          })
          .getAllSheetsData();
      } else {
        // Fallback untuk testing lokal
        await fetchCsvDataAll();
      }
    }

    async function fetchCsvDataAll() {
      try {
        const tabs = ['FAN', 'ELECTRICAL', 'LIGHTING', 'STOCK'];
        
        await Promise.all(tabs.map(async (tab) => {
          if (CSV_URLS[tab]) {
            const res = await fetch(CSV_URLS[tab]);
            const text = await res.text();
            allData[tab] = parseCSV(text);
          }
        }));
        
        sessionStorage.setItem('elite_fan_data_v1', JSON.stringify(allData));
        updateSyncStatus(false, "Selesai Memuat");
        renderCurrentTab();
      } catch (err) {
        console.error("Error loading CSV data", err);
        updateSyncStatus(false, "Gagal Memuat");
      }
    }

    /**
     * Fast CSV Parser
     */
    function parseCSV(csvText) {
      const lines = csvText.split(/\r\n|\n/);
      if (lines.length === 0) return [];

      let headerIdx = -1;
      for (let i = 0; i < Math.min(15, lines.length); i++) {
        if (lines[i].toUpperCase().includes('ARTICLE') || lines[i].toUpperCase().includes('PRODUCT NAME')) {
          headerIdx = i;
          break;
        }
      }
      if (headerIdx === -1) headerIdx = 0;

      const headers = parseCSVLine(lines[headerIdx]);
      const result = [];

      for (let i = headerIdx + 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const rowVals = parseCSVLine(lines[i]);
        const rowObj = {};
        let hasValue = false;

        headers.forEach((h, idx) => {
          if (h) {
            const val = rowVals[idx] !== undefined ? rowVals[idx].trim() : '';
            rowObj[h] = val;
            if (val) hasValue = true;
          }
        });

        if (hasValue) result.push(rowObj);
      }
      return result;
    }

    function parseCSVLine(line) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(cur);
          cur = '';
        } else {
          cur += char;
        }
      }
      result.push(cur);
      return result;
    }

    function updateSyncStatus(loading, text) {
      const el = document.getElementById('sync-status');
      const textEl = document.getElementById('sync-text');
      textEl.innerText = text;
      if (loading) {
        el.classList.add('loading');
      } else {
        el.classList.remove('loading');
      }
    }

    /* Switch Sheet Tab */
    function switchTab(tabName, btnElement) {
      currentTab = tabName;
      
      // Update UI Tabs
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      if (btnElement) {
        btnElement.classList.add('active');
      } else {
        // Fallback if called without element
        document.querySelectorAll('.tab-btn').forEach(btn => {
          if (btn.textContent.trim() === tabName) btn.classList.add('active');
        });
      }
      
      document.getElementById('active-tab-label').innerText = 'Tab: ' + tabName;
      
      // Clear search input on tab change to prevent confusion
      document.getElementById('search-input').value = '';
      
      renderCurrentTab();
    }

    /* Render Active Tab & Populate Filters */
    function renderCurrentTab() {
      populateCategoryFilter();
      applyFilters();
    }

    function populateCategoryFilter() {
      const select = document.getElementById('category-filter');
      select.innerHTML = '<option value="">Semua Kategori</option>';

      const data = allData[currentTab] || [];
      const categories = new Set();

      data.forEach(item => {
        const cat = item['PURCH. GROUP'] || item['PURCH GROUP'] || item['Kategori'] || '';
        if (cat) categories.add(cat);
      });

      Array.from(categories).sort().forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.innerText = cat;
        select.appendChild(opt);
      });
    }

    /* Search & Filtering Engine */
    function onSearchInput() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        applyFilters();
      }, 150);
    }

    function applyFilters() {
      const data = allData[currentTab] || [];
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const catVal = document.getElementById('category-filter').value;
      const statusVal = document.getElementById('status-filter').value;

      filteredList = data.filter(item => {
        // Category Filter
        if (catVal) {
          const itemCat = item['PURCH. GROUP'] || item['PURCH GROUP'] || item['Kategori'] || '';
          if (itemCat !== catVal) return false;
        }

        // Status Filter
        if (statusVal) {
          const itemStatus = (item['STATUS'] || '').toLowerCase();
          if (!itemStatus.includes(statusVal.toLowerCase())) return false;
        }

        // Search Query (Matches Article, Name, Barcode, etc.)
        if (query) {
          const article = (item['ARTICLE'] || '').toLowerCase();
          const name = (item['PRODUCT NAME'] || item['Nama Produk'] || '').toLowerCase();
          const barcode = (item['BARCODE'] || '').toLowerCase();
          const cat = (item['PURCH. GROUP'] || '').toLowerCase();

          return article.includes(query) || name.includes(query) || barcode.includes(query) || cat.includes(query);
        }

        return true;
      });

      currentPage = 1;
      renderList(true);
    }

    /* Render Rows List (Table-like View for HP) */
    function renderList(reset = false) {
      const container = document.getElementById('data-list');
      if (reset) container.innerHTML = '';

      document.getElementById('total-count').innerText = filteredList.length;

      if (filteredList.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size:36px;margin-bottom:8px;">🔍</div>
            <p>Tidak ada data produk yang sesuai.</p>
          </div>
        `;
        document.getElementById('visible-count').innerText = 0;
        document.getElementById('btn-load-more').style.display = 'none';
        return;
      }

      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const endIndex = Math.min(currentPage * PAGE_SIZE, filteredList.length);
      const pageItems = filteredList.slice(startIndex, endIndex);

      pageItems.forEach((item, idx) => {
        const itemIdx = startIndex + idx;
        const card = createRowCard(item, itemIdx);
        container.appendChild(card);
      });

      document.getElementById('visible-count').innerText = endIndex;

      const btnMore = document.getElementById('btn-load-more');
      if (endIndex < filteredList.length) {
        btnMore.style.display = 'block';
      } else {
        btnMore.style.display = 'none';
      }
    }

    function loadNextPage() {
      currentPage++;
      renderList(false);
    }

    /* Create Single Row Card (Gambar 1 & Gambar 2 at FAR LEFT) */
    function createRowCard(item, idx) {
      const card = document.createElement('div');
      card.className = 'data-row-card';
      card.onclick = () => openModal(item);

      const img1 = item['Gambar'] || item['Gambar1'] || '';
      const img2 = item['Gambar 2'] || item['Gambar2'] || '';
      const article = item['ARTICLE'] || '-';
      const name = item['PRODUCT NAME'] || item['Nama Produk'] || 'Tanpa Nama';
      const category = item['PURCH. GROUP'] || item['Kategori'] || '-';
      const stock = item['STOCK'] || item['Stok'] || '0';
      const status = item['STATUS'] || 'Active';
      const promoDisc = item['OLD PROMO'] || '';
      const price = item['HARGA PROMO ALL STORE'] || item['SP ZONA 1'] || '';

      // Status Badge Style
      let statusClass = 'status-active';
      if (status.toLowerCase().includes('discontinue')) statusClass = 'status-discontinue';
      if (status.toLowerCase().includes('inactive')) statusClass = 'status-inactive';

      // Images Far Left HTML
      let imagesHtml = '';
      if (img1 || img2) {
        const src1 = img1 || img2;
        const src2 = img2 || img1;
        imagesHtml = `
          <div class="row-images-group">
            <img class="thumb-img" src="${src1}" loading="lazy" onerror="this.src='https://via.placeholder.com/44x44/0a1122/64748b?text=Fan'">
            <img class="thumb-img" src="${src2}" loading="lazy" onerror="this.src='https://via.placeholder.com/44x44/0a1122/64748b?text=Fan'">
          </div>
        `;
      } else {
        imagesHtml = `
          <div class="row-images-group">
            <div class="thumb-fallback">📷</div>
            <div class="thumb-fallback">📷</div>
          </div>
        `;
      }

      // Stock text highlight
      const hasStockNum = parseFloat(stock.toString().replace('.', '').replace(',', '.')) > 0;
      const stockClass = hasStockNum ? 'has-stock' : 'no-stock';

      card.innerHTML = `
        ${imagesHtml}
        <div class="row-info">
          <div class="row-header">
            <span class="row-article">#${article}</span>
            <span class="status-badge ${statusClass}">${status}</span>
          </div>
          <div class="row-title">${name}</div>
          <div class="row-subinfo">
            <span class="category-badge">${category}</span>
            <span>Stok: <strong class="stock-badge ${stockClass}">${stock}</strong></span>
          </div>
        </div>
        <div class="row-price-col">
          ${price ? `<div class="price-value">${price}</div>` : ''}
          ${promoDisc ? `<div class="promo-disc">Disc ${promoDisc}</div>` : ''}
        </div>
      `;

      return card;
    }

    /* ================= DETAIL MODAL CARD LOGIC ================= */
    let currentModalItem = null;

    function openModal(item) {
      currentModalItem = item;
      const name = item['PRODUCT NAME'] || item['Nama Produk'] || 'Detail Produk';
      const article = item['ARTICLE'] || '-';
      const img1 = item['Gambar'] || item['Gambar1'] || '';
      const img2 = item['Gambar 2'] || item['Gambar2'] || '';
      const category = item['PURCH. GROUP'] || '-';
      const status = item['STATUS'] || 'Active';
      const stock = item['STOCK'] || '0';
      const price = item['HARGA PROMO ALL STORE'] || item['SP ZONA 1'] || '-';
      const remark = item['REMARK TO STORE'] || item['OLD PROMO'] || '-';
      const periode = item['Periode Promo'] || '29 Jul - 1 Sept 2026';
      const barcodeData = item['BARCODE'] || article;
      const linkRR = item['Link to RR'] || `https://www.ruparupa.com/acestore/jual/${article}`;

      document.getElementById('modal-product-name').innerText = name;
      document.getElementById('modal-article-code').innerText = 'Article: ' + article;
      document.getElementById('modal-category').innerText = category;
      document.getElementById('modal-status').innerText = status;
      document.getElementById('modal-stock').innerText = stock;
      document.getElementById('modal-price').innerText = price;
      document.getElementById('modal-remark').innerText = remark;
      document.getElementById('modal-periode').innerText = periode;

      // Setup Image Gallery
      const mainImg = document.getElementById('modal-main-img');
      const thumbsContainer = document.getElementById('modal-thumbs');
      thumbsContainer.innerHTML = '';

      const images = [];
      if (img1) images.push(img1);
      if (img2 && img2 !== img1) images.push(img2);

      if (images.length === 0) {
        mainImg.src = 'https://via.placeholder.com/300x200/0a1122/64748b?text=No+Image';
      } else {
        mainImg.src = images[0];
        images.forEach((imgUrl, idx) => {
          const btn = document.createElement('img');
          btn.className = `gallery-thumb-btn ${idx === 0 ? 'active' : ''}`;
          btn.src = imgUrl;
          btn.onclick = () => {
            mainImg.src = imgUrl;
            document.querySelectorAll('.gallery-thumb-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          };
          thumbsContainer.appendChild(btn);
        });
      }

      // Barcode Image Generation (QR/Barcode Image)
      const barcodeImg = document.getElementById('modal-barcode-img');
      const barcodeText = document.getElementById('modal-barcode-text');
      barcodeText.innerText = barcodeData;
      barcodeImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(barcodeData)}`;

      // Ruparupa Link
      const rrBtn = document.getElementById('modal-rr-link');
      if (linkRR && !linkRR.includes('#REF!')) {
        rrBtn.href = linkRR;
        rrBtn.style.display = 'block';
      } else {
        rrBtn.href = `https://www.ruparupa.com/acestore/jual/${article}`;
        rrBtn.style.display = 'block';
      }

      document.getElementById('detail-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.remove('active');
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'detail-modal') closeModal();
    }

    /* ================= CAMERA BARCODE SCANNER ================= */
    function startScanner() {
      const modal = document.getElementById('scanner-modal');
      modal.classList.add('active');

      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      }

      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        config,
        (decodedText, decodedResult) => {
          // On Successful scan
          stopScanner();
          const searchInput = document.getElementById('search-input');
          searchInput.value = decodedText;
          applyFilters();
        },
        (errorMessage) => {
          // parse error, ignore
        }
      ).catch(err => {
        alert("Gagal membuka kamera: " + err);
        stopScanner();
      });
    }

    function stopScanner() {
      const modal = document.getElementById('scanner-modal');
      modal.classList.remove('active');
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          console.log("Scanner stopped.");
        }).catch(err => console.log("Stop scanner error", err));
      }
    }
  </script>
